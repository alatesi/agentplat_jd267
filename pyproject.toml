[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alatesi-agentplat_jd267"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "alatesi" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://alatesi.github.io"
Repository = "https://github.com/alatesi/agentplat_jd267"
Issues = "https://github.com/alatesi/agentplat_jd267/issues"

[project.scripts]
agentplat_jd267 = "agentplat_jd267:main"

[tool.setuptools]
py-modules = ["agentplat_jd267"]
